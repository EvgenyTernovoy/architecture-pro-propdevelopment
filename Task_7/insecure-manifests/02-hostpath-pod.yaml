apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: audit-zone
spec:
  containers:
    - name: nginx
      image: nginx:stable
      volumeMounts:
        - mountPath: /host-data
          name: host-volume
  volumes:
    - name: host-volume
      hostPath:
        path: /tmp
        type: Directory
